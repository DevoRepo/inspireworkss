# Temporary preview hosting on GitHub Pages (https://<owner>.github.io/<repo>/).
# The production site is intended for Cloudflare Pages; this preview is kept out of search engines.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so new YouTube videos and view counts appear on the Resources page.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # "prebuild" refreshes the long-form YouTube videos before the site is built.
      - run: npm run build
        env:
          # Optional: add a YouTube Data API key as a repository secret to list every video
          # (without it, the public feed of the latest 15 long-form videos is used).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          NOINDEX: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
