# Builds the site and deploys it to Cloudflare (https://inspireworkss.inspireworkss.workers.dev).
#
# Runs on every push to main, daily (so new YouTube videos and view counts appear),
# and on demand: Actions → "Deploy to Cloudflare" → Run workflow.
#
# Repository secrets used:
#   CLOUDFLARE_API_TOKEN — "Edit Cloudflare Workers" API token (account id is in wrangler.jsonc)
#   YOUTUBE_API_KEY      — YouTube Data API v3 key (optional; without it the public feed is used)
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC daily
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer run waits for the current one.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same command as a manual deploy: type-check → fetch YouTube videos → build → wrangler deploy.
      - run: npm run deploy
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
